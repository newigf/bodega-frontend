trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      npm install
      npm run build
    displayName: Instalar y compilar el frontend

  - script: docker build -t bodega-frontend:$(Build.BuildId) .
    displayName: Construir la imagen Docker

  - script: curl -fsS -X POST "$DEPLOY_HOOK_URL"
    displayName: Desplegar el frontend en Render
    env:
      DEPLOY_HOOK_URL: $(DEPLOY_HOOK_URL)